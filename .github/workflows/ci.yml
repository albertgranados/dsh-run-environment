name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The package has no dependencies: there is nothing to install, and the
      # suite runs offline.
      - run: node --test
        name: test
      - name: manifest is valid and the client bundle parses
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"
          node --check lib/client.js
          node --check lib/index.js
